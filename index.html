ottom: 10px; font-size: 13px; line-height: 1.4\">{{ error }}<\/div>\n<\/sc-if>\n<button type=\"button\" onClick=\"{{ pay }}\" style=\"{{ payStyle }}\">{{ payLabel }}<\/button>\n<\/div>\n<\/sc-if>\n\n<sc-if value=\"{{ isDone }}\" hint-placeholder-val=\"{{ false }}\">\n<div style=\"flex: 1; min-height: 0; overflow-y: auto; display: flex; flex-direction: column; gap: 22px; padding: 56px 20px 24px\">\n<div style=\"width: 64px; height: 64px; border-radius: 32px; background: #DCEFEE; display: flex; align-items: center; justify-content: center\">\n<svg width=\"30\" height=\"30\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0B6B6A\" stroke-width=\"2.5\" stroke-linecap=\"round\" stroke-linejoin=\"round\" aria-hidden=\"true\"><path d=\"M5 12l5 5 9-10\"/><\/svg>\n<\/div>\n<div style=\"display: flex; flex-direction: column; gap: 8px\">\n<h2 style=\"margin: 0; font-family: 'Space Grotesk', sans-serif; font-size: 28px; line-height: 1.2; font-weight: 700\">Réservation enregistrée<\/h2>\n<p style=\"margin: 0; font-size: 15px; line-height: 1.5; color: #5B6B75\">{{ doneText }}<\/p>\n<\/div>\n<div style=\"background: #FFFFFF; border: 1px solid #DCE3E6; border-radius: 14px; padding: 14px; display: flex; flex-direction: column; gap: 10px; font-size: 14px\">\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"color: #5B6B75\">Logement<\/span><span style=\"font-weight: 600; text-align: right\">{{ resName }}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"color: #5B6B75\">Séjour<\/span><span style=\"font-weight: 600\">{{ stayLabel }}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"color: #5B6B75\">Statut<\/span><span style=\"font-weight: 600\">En attente de paiement<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px; font-variant-numeric: tabular-nums\"><span style=\"color: #5B6B75\">Montant<\/span><span style=\"font-weight: 600\">{{ lineTotal }}<\/span><\/div>\n<div style=\"display: flex; justify-content: space-between; gap: 12px\"><span style=\"color: #5B6B75\">Référence<\/span><span style=\"font-weight: 600\">{{ reference }}<\/span><\/div>\n<\/div>\n<sc-if value=\"{{ hasError }}\" hint-placeholder-val=\"{{ false }}\">\n<div role=\"alert\" style=\"background: #FDECEA; color: #8A1C12; border-radius: 12px; padding: 10px 14px; font-size: 13px; line-height: 1.4\">{{ error }}<\/div>\n<\/sc-if>\n<button type=\"button\" onClick=\"{{ payWave }}\" style=\"{{ waveStyle }}\">{{ waveLabel }}<\/button>\n<a href=\"Compte.dc.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; border: 1px solid #0B6B6A; background: #DCEFEE; color: #0B6B6A; font-size: 16px; font-weight: 600\">Voir mes réservations<\/a>\n<a href=\"Main.dc.html\" style=\"display: flex; align-items: center; justify-content: center; min-height: 52px; border-radius: 14px; background: #0B6B6A; color: #FFFFFF; font-size: 16px; font-weight: 600\">Retour à l'accueil<\/a>\n<\/div>\n<\/sc-if>\n<\/div>\n<\/x-dc>\n<script type=\"text/x-dc\" data-dc-script data-props='{\"$preview\":{\"width\":390,\"height\":844}}'>\nclass Component extends DCLogic {\n  constructor(props) {\n    super(props);\n    const t = new Date();\n    this.state = {\n      step: 'pay', method: 'Wave', res: null, busy: [], loading: true, saving: false, error: '', booking: null,\n      start: this.ymd(this.addDays(t, 1)), end: this.ymd(this.addDays(t, 4)), guests: Math.max(1, parseInt(props.g, 10) || 2)\n    };\n  }\n  componentDidMount() {\n    const api = window.IvoireAPI;\n    const id = this.props.id;\n    Promise.all([api.getResidence(id), api.busyDates(id)])\n      .then((r) => {\n        const res = r[0];\n        const g = res ? Math.min(this.state.guests, res.max_guests || 2) : this.state.guests;\n        this.setState({ res: res, busy: r[1] || [], loading: false, guests: g,\n          error: res ? '' : 'Cette résidence est introuvable ou n’est plus en ligne.' });\n      })\n      .catch((e) => this.setState({ loading: false, error: (e && e.message) || 'Erreur de chargement.' }));\n  }\n  addDays(d, n) { const x = new Date(d.getFullYear(), d.getMonth(), d.getDate()); x.setDate(x.getDate() + n); return x; }\n  ymd(d) { return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); }\n  parse(s) { const m = /^(\\d{4})-(\\d{2})-(\\d{2})$/.exec(s || ''); return m ? new Date(+m[1], +m[2] - 1, +m[3]) : null; }\n  nights(a, b) { const x = this.parse(a), y = this.parse(b); return x && y ? Math.round((y - x) / 86400000) : 0; }\n  dayLabel(s) {\n    const d = this.parse(s);\n    const mois = ['janv.', 'févr.', 'mars', 'avr.', 'mai', 'juin', 'juil.', 'août', 'sept.', 'oct.', 'nov.', 'déc.'];\n    return d ? d.getDate() + ' ' + mois[d.getMonth()] : '';\n  }\n  conflict(a, b) { return this.state.busy.some((r) => a < r.end_date && b > r.start_date); }\n  readDates() {\n    const a = document.getElementById('arrivee'), b = document.getElementById('depart');\n    return { start: a ? a.value : this.state.start, end: b ? b.value : this.state.end };\n  }\n  changeStart() {\n    const v = this.readDates();\n    let end = v.end;\n    if (!end || end <= v.start) { const d = this.parse(v.start); end = d ? this.ymd(this.addDays(d, 1)) : end; }\n    const dep = document.getElementById('depart');\n    if (dep) dep.value = end;\n    this.setState({ start: v.start, end: end, error: '' });\n  }\n  changeEnd() { this.setState({ end: this.readDates().end, error: '' }); }\n  money(n) { return window.IvoireAPI.fmt(n) + ' FCFA'; }\n  price() {\n    const r = this.state.res;\n    const n = this.nights(this.state.start, this.state.end);\n    const unit = r ? r.price_per_day : 0;\n    const sub = n > 0 ? n * unit : 0;\n    const fee = Math.round(sub * 0.05);\n    return { n: n, unit: unit, sub: sub, fee: fee, total: sub + fee };\n  }\n  validate() {\n    const st = this.state;\n    const today = this.ymd(new Date());\n    if (!st.res) return 'Résidence introuvable.';\n    if (!st.start || !st.end) return 'Choisissez vos dates d’arrivée et de départ.';\n    if (st.start < today) return 'La date d’arrivée est déjà passée.';\n    if (this.nights(st.start, st.end) < 1) return 'Le départ doit être après l’arrivée (au moins 1 jour).';\n    if (this.nights(st.start, st.end) > 60) return 'Un séjour dure 60 jours au maximum.';\n    if (this.conflict(st.start, st.end)) return 'Ces dates ne sont pas disponibles. Choisissez d’autres dates.';\n    return '';\n  }\n  payWave() {\n    const b = this.state.booking;\n    if (!b || this.state.paying) return;\n    this.setState({ paying: true, error: '' });\n    window.IvoireAPI.payBooking(b.id, b.total)\n      .then((url) => { location.href = url; })\n      .catch((e) => this.setState({ paying: false, error: (e && e.message) || 'Le paiement a échoué.' }));\n  }\n  pay() {\n    if (this.state.saving) return;\n    const problem = this.validate();\n    if (problem) { this.setState({ error: problem }); return; }\n    const st = this.state;\n    this.setState({ saving: true, error: '' });\n    window.IvoireAPI.createBooking(st.res.id, st.start, st.end, st.guests)\n      .then((b) => this.setState({ saving: false, step: 'done', booking: b }))\n      .catch((e) => this.setState({ saving: false, error: (e && e.message) || 'La réservation a échoué. Réessayez.' }));\n  }\n  renderVals() {\n    const st = this.state;\n    const r = st.res;\n    const names = ['Wave', 'Orange Money', 'MTN MoMo', 'Carte bancaire'];\n    const on = 'min-height: 52px; border-radius: 12px; border: 2px solid #0B6B6A; background: #DCEFEE; color: #0B6B6A; font-size: 14px; font-weight: 600; cursor: pointer';\n    const off = 'min-height: 52px; border-radius: 12px; border: 1px solid #DCE3E6; background: #FFFFFF; color: #12263A; font-size: 14px; font-weight: 500; cursor: pointer';\n    const m = st.method;\n    const card = m === 'Carte bancaire';\n    const p = this.price();\n    const today = this.ymd(new Date());\n    const minEnd = st.start ? this.ymd(this.addDays(this.parse(st.start) || new Date(), 1)) : today;\n    const taken = st.start && st.end && this.nights(st.start, st.end) > 0 && this.conflict(st.start, st.end);\n    const maxG = r ? (r.max_guests || 2) : 2;\n    const unitLabel = p.n > 0 ? this.money(p.unit) + ' × ' + p.n + (p.n > 1 ? ' jours' : ' jour') : 'Choisissez vos dates';\n    let dateNote = '';\n    let ok = false;\n    if (taken) dateNote = 'Ces dates ne sont pas disponibles. Choisissez d’autres dates.';\n    else if (p.n > 0) { dateNote = p.n + (p.n > 1 ? ' jours' : ' jour') + ' de 24 h, du ' + this.dayLabel(st.start) + ' au ' + this.dayLabel(st.end); ok = true; }\n    const done = st.booking;\n    const total = done ? done.total : p.total;\n    const canPay = !!r && ok && !st.saving;\n    return {\n      isPay: st.step === 'pay',\n      isDone: st.step === 'done',\n      backHref: this.props.id ? 'Fiche.dc.html?id=' + this.props.id : 'Resultats.dc.html',\n      resName: st.loading ? 'Chargement…' : (r ? r.name : 'Résidence introuvable'),\n      resSummary: r ? r.quarter + ' · ' + this.money(r.price_per_day) + ' par jour (24 h)' : '',\n      minStart: today,\n      minEnd: minEnd,\n      startVal: st.start,\n      endVal: st.end,\n      onStart: () => this.changeStart(),\n      onEnd: () => this.changeEnd(),\n      guests: st.guests,\n      lessGuests: () => this.setState({ guests: Math.max(1, st.guests - 1) }),\n      moreGuests: () => this.setState({ guests: Math.min(maxG, st.guests + 1) }),\n      hasDateNote: !!dateNote,\n      dateNote: dateNote,\n      dateNoteBg: taken ? '#FDECEA' : '#DCEFEE',\n      dateNoteFg: taken ? '#8A1C12' : '#0B4F4E',\n      methods: names.map((n) => ({\n        label: n,\n        pressed: m === n,\n        style: m === n ? on : off,\n        pick: () => this.setState({ method: n })\n      })),\n      fieldLabel: card ? 'Numéro de carte' : 'Numéro ' + m,\n      fieldHint: card ? '0000 0000 0000 0000' : '07 00 00 00 00',\n      methodName: m,\n      lineDays: unitLabel,\n      lineSubtotal: this.money(done ? done.total - done.service_fee : p.sub),\n      lineFee: this.money(done ? done.service_fee : p.fee),\n      lineTotal: this.money(total),\n      stayLabel: this.dayLabel(done ? done.start_date : st.start) + ' – ' + this.dayLabel(done ? done.end_date : st.end),\n      reference: done ? String(done.id).slice(0, 8).toUpperCase() : '',\n      doneText: (window.APP_CONFIG && window.APP_CONFIG.wavePayLink)\n        ? 'Votre réservation est enregistrée. Payez avec Wave avec le numéro de votre compte : nous confirmons votre réservation dès réception du paiement. Gardez votre référence. Sans paiement, les dates sont libérées au bout de 24 h.'\n        : 'Votre réservation est enregistrée. Payez avec Wave pour la confirmer : sans paiement, les dates sont libérées au bout de 24 h.',\n      hasError: !!st.error,\n      error: st.error,\n      payLabel: st.saving ? 'Enregistrement…' : (canPay ? 'Réserver · ' + this.money(p.total) : 'Réserver'),\n      payStyle: 'width: 100%; min-height: 52px; border: none; border-radius: 14px; background: ' + (canPay ? '#0B6B6A' : '#9FB5B4') + '; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: ' + (canPay ? 'pointer' : 'default'),\n      payWave: () => this.payWave(),\n      waveLabel: st.paying ? 'Ouverture de Wave…' : 'Payer ' + this.money(total) + ' avec Wave',\n      waveStyle: 'min-height: 52px; border: none; border-radius: 14px; background: #1DA1F2; color: #FFFFFF; font-size: 16px; font-weight: 600; cursor: pointer',\n      pay: () => this.pay()\n    };\n  }\n}\n<\/script>\n<\/body>\n<\/html>\n", "Proprietaire": "<!doctype html>\n<html lang=\"fr\">\n<head>\n<meta charset=\"utf-8\">\n<title>Espace propriétaire<\/title>\n<script src=\"./support.js\"><\/script>\n<\/head>\n<body>\n<x-dc>\n<helmet>\n<link rel=\"stylesheet\" href=\"http <script>
/*
 * dc-lite.js
 * Petit moteur qui affiche les écrans de la maquette (fichiers .dc.html) tels quels.
 * Il comprend : {{ valeur }}, <sc-if>, <sc-for>, onClick="{{ fonction }}",
 * et la classe DCLogic (state, setState, renderVals).
 * Vous n'avez pas besoin de modifier ce fichier pour changer le design :
 * le design est dans les fichiers du dossier screens/.
 */
(function () {
  'use strict';

  var HOLE = /\{\{\s*([^}]+?)\s*\}\}/g;
  var WHOLE = /^\{\{\s*([^}]+?)\s*\}\}$/;

  /* ---------- Classe de base des écrans ---------- */
  function DCLogic(props) {
    this.props = props || {};
    this.state = {};
    this.__render = null;
  }
  DCLogic.prototype.setState = function (partial) {
    var next = typeof partial === 'function' ? partial(this.state, this.props) : partial;
    this.state = Object.assign({}, this.state, next);
    if (this.__render) this.__render();
  };
  DCLogic.prototype.forceUpdate = function () {
    if (this.__render) this.__render();
  };
  DCLogic.prototype.componentDidMount = function () {};
  DCLogic.prototype.renderVals = function () { return {}; };

  /* ---------- Lecture des valeurs {{ chemin.valeur }} ---------- */
  function resolve(path, scope) {
    if (path === 'true') return true;
    if (path === 'false') return false;
    if (path === 'null') return null;
    if (/^-?\d+(\.\d+)?$/.test(path)) return Number(path);
    var parts = path.split('.');
    var cur = scope;
    for (var i = 0; i < parts.length; i++) {
      if (cur == null) return undefined;
      cur = cur[parts[i]];
    }
    return cur;
  }
  function str(v) { return v == null ? '' : String(v); }
  function evalAttr(val, scope) {
    var m = WHOLE.exec(val || '');
    return m ? resolve(m[1], scope) : val;
  }

  /* ---------- Affichage d'un noeud ---------- */
  function renderChildren(node, scope, parent) {
    for (var c = node.firstChild; c; c = c.nextSibling) renderNode(c, scope, parent);
  }

  function renderNode(node, scope, parent) {
    if (node.nodeType === 3) {
      parent.appendChild(document.createTextNode(
        node.nodeValue.replace(HOLE, function (m, p) { return str(resolve(p, scope)); })
      ));
      return;
    }
    if (node.nodeType !== 1) return;

    var tag = node.localName;
    if (tag === 'helmet') return;

    if (tag === 'sc-if') {
      if (evalAttr(node.getAttribute('value'), scope)) renderChildren(node, scope, parent);
      return;
    }

    if (tag === 'sc-for') {
      var list = evalAttr(node.getAttribute('list'), scope) || [];
      var name = node.getAttribute('as') || 'item';
      for (var i = 0; i < list.length; i++) {
        var inner = Object.create(scope);
        inner[name] = list[i];
        inner.$index = i;
        renderChildren(node, inner, parent);
      }
      return;
    }

    var el = node.namespaceURI
      ? document.createElementNS(node.namespaceURI, node.localName)
      : document.createElement(tag);

    for (var a = 0; a < node.attributes.length; a++) {
      var attr = node.attributes[a];
      var an = attr.name;
      if (an.indexOf('hint-') === 0) continue;
      var whole = WHOLE.exec(attr.value);

      if (/^on/i.test(an)) {
        if (whole) {
          var fn = resolve(whole[1], scope);
          if (typeof fn === 'function') el.addEventListener(an.slice(2).toLowerCase(), fn);
        }
        continue;
      }
      if (whole) {
        var raw = resolve(whole[1], scope);
        if (raw == null) continue;
        el.setAttribute(an, String(raw));
      } else {
        el.setAttribute(an, attr.value.replace(HOLE, function (m, p) { return str(resolve(p, scope)); }));
      }
    }
    renderChildren(node, scope, el);
    parent.appendChild(el);
  }

  /* ---------- Montage d'un écran ---------- */
  function mount(def, container, props) {
    var instance = new def.Component(Object.assign({}, def.props, props));

    function render() {
      var saved = snapshot(container);
      var scope = Object.assign({}, instance.renderVals());
      container.replaceChildren();
      for (var c = def.template.firstChild; c; c = c.nextSibling) renderNode(c, scope, container);
      restore(container, saved);
    }

    instance.__render = render;
    render();
    instance.componentDidMount();
    return instance;
  }

  /* Garde les champs de saisie et les défilements quand l'écran se redessine */
  function snapshot(root) {
    var inputs = {};
    root.querySelectorAll('input[id], textarea[id]').forEach(function (el) { inputs[el.id] = el.value; });
    var active = document.activeElement;
    var focus = active && active.id && root.contains(active)
      ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;
    var scrolls = [];
    root.querySelectorAll('*').forEach(function (el, i) {
      if (el.scrollTop > 0) scrolls.push([i, el.scrollTop]);
    });
    return { inputs: inputs, focus: focus, scrolls: scrolls };
  }
  function restore(root, saved) {
    Object.keys(saved.inputs).forEach(function (id) {
      var el = root.querySelector('#' + id);
      if (el) el.value = saved.inputs[id];
    });
    var all = root.querySelectorAll('*');
    saved.scrolls.forEach(function (s) { if (all[s[0]]) all[s[0]].scrollTop = s[1]; });
    if (saved.focus) {
      var f = root.querySelector('#' + saved.focus.id);
      if (f) {
        f.focus();
        try { f.setSelectionRange(saved.focus.start, saved.focus.end); } catch (e) { /* ignore */ }
      }
    }
  }

  /* ---------- Lecture d'un fichier .dc.html ---------- */
  function parse(html) {
    var doc = new DOMParser().parseFromString(html, 'text/html');
    var xdc = doc.querySelector('x-dc');
    var scriptEl = doc.querySelector('script[data-dc-script]');
    if (!xdc || !scriptEl) throw new Error('Écran invalide');
    var Component = new Function('DCLogic', scriptEl.textContent + '\nreturn Component;')(DCLogic);
    var helmet = xdc.querySelector('helmet');
    return {
      Component: Component,
      props: {},
      template: xdc,
      helmet: helmet
    };
  }

  window.DCLogic = DCLogic;
  window.DCLite = { parse: parse, mount: mount };
})();

<script>
/*
 * api.js
 * Parle à Supabase (comptes par SMS + base de données) avec de simples appels web.
 * Aucune clé secrète ici : seulement l'adresse du projet et la clé publique (js/config.js).
 * Les règles de sécurité (RLS) de la base décident de ce que chacun a le droit de voir.
 */
(function () {
  'use strict';

  var cfg = window.APP_CONFIG || {};
  var STORE = 'ivoire.session';
  var session = null;
  var profileCache = null;

  try { session = JSON.parse(localStorage.getItem(STORE) || 'null'); } catch (e) { session = null; }

  function save(s) {
    session = s;
    profileCache = null;
    try {
      if (s) localStorage.setItem(STORE, JSON.stringify(s));
      else localStorage.removeItem(STORE);
    } catch (e) { /* stockage indisponible : la session ne survivra pas au rechargement */ }
  }

  function toSession(s) {
    return {
      access_token: s.access_token,
      refresh_token: s.refresh_token,
      expires_at: s.expires_at || Math.floor(Date.now() / 1000) + (s.expires_in || 3600),
      user: s.user
    };
  }

  function configured() { return !!(cfg.supabaseUrl && cfg.supabaseAnonKey); }

  function messageOf(body, status) {
    var m = body && (body.msg || body.message || body.error_description || body.error || body.hint);
    return m ? String(m) : 'Erreur ' + status;
  }

  /* Un appel web brut vers Supabase */
  function raw(path, opts) {
    opts = opts || {};
    var headers = { apikey: cfg.supabaseAnonKey, 'Content-Type': 'application/json' };
    if (opts.auth !== false && session && session.access_token) {
      headers.Authorization = 'Bearer ' + session.access_token;
    }
    if (opts.prefer) headers.Prefer = opts.prefer;
    return fetch(cfg.supabaseUrl + path, {
      method: opts.method || 'GET',
      headers: headers,
      body: opts.body ? JSON.stringify(opts.body) : undefined
    }).then(function (r) {
      return r.text().then(function (t) {
        var body = null;
        try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
        if (!r.ok) {
          var err = new Error(messageOf(body, r.status));
          err.status = r.status;
          throw err;
        }
        return body;
      });
    });
  }

  /* Renouvelle la session un peu avant qu'elle expire */
  function refreshIfNeeded() {
    if (!session || !session.refresh_token) return Promise.resolve();
    if (session.expires_at - Date.now() / 1000 > 60) return Promise.resolve();
    return raw('/auth/v1/token?grant_type=refresh_token', {
      method: 'POST', auth: false, body: { refresh_token: session.refresh_token }
    }).then(function (s) { save(toSession(s)); })
      .catch(function () { save(null); });
  }

  function request(path, opts) {
    return refreshIfNeeded().then(function () { return raw(path, opts); });
  }

  function first(rows) { return rows && rows.length ? rows[0] : null; }
  function isId(id) { return /^[0-9a-fA-F-]{36}$/.test(String(id || '')); }
  function uid() { return session && session.user ? session.user.id : null; }

  /* ---------- Comptes (SMS) ---------- */
  function sendCode(phone, opts) {
    var body = { phone: phone, create_user: !!opts.create };
    if (opts.create) body.data = { full_name: opts.name, phone: phone, role: opts.role };
    return raw('/auth/v1/otp', { method: 'POST', auth: false, body: body });
  }

  function verifyCode(phone, code) {
    return raw('/auth/v1/verify', { method: 'POST', auth: false, body: { type: 'sms', phone: phone, token: code } })
      .then(function (s) { save(toSession(s)); return session; });
  }

  function signOut() {
    var done = session ? raw('/auth/v1/logout', { method: 'POST' }).catch(function () {}) : Promise.resolve();
    return done.then(function () { save(null); });
  }

  function profile() {
    if (!session) return Promise.resolve(null);
    if (profileCache) return Promise.resolve(profileCache);
    return request('/rest/v1/profiles?select=*&id=eq.' + uid()).then(function (rows) {
      profileCache = first(rows);
      return profileCache;
    });
  }

  /* ---------- Résidences ---------- */
  var PUBLIC_COLUMNS = 'id,name,quarter,price_per_day,rooms,max_guests,equipments,description,approx_lat,approx_lng';

  function listResidences() {
    return request('/rest/v1/residences?select=' + PUBLIC_COLUMNS + '&status=eq.online&order=created_at.desc');
  }

  function getResidence(id) {
    if (!isId(id)) return Promise.resolve(null);
    return request('/rest/v1/residences?select=' + PUBLIC_COLUMNS + '&status=eq.online&id=eq.' + id).then(first);
  }

  function myResidences() {
    return request('/rest/v1/residences?select=id,name,quarter,price_per_day,status,approved,created_at&owner_id=eq.' +
      uid() + '&order=created_at.desc');
  }

  function createResidence(residence, privateInfo) {
    var row = Object.assign({ owner_id: uid(), status: 'pending' }, residence);
    return request('/rest/v1/residences', { method: 'POST', prefer: 'return=representation', body: row })
      .then(function (rows) {
        var created = first(rows);
        if (!created) throw new Error('La résidence n’a pas été enregistrée.');
        if (!privateInfo) return created;
        var priv = Object.assign({ residence_id: created.id }, privateInfo);
        return request('/rest/v1/residence_private', { method: 'POST', body: priv }).then(function () { return created; });
      });
  }

  function setStatus(id, status) {
    if (!isId(id)) return Promise.reject(new Error('Résidence inconnue'));
    return request('/rest/v1/residences?id=eq.' + id, {
      method: 'PATCH', prefer: 'return=representation', body: { status: status }
    }).then(function (rows) {
      var updated = first(rows);
      if (!updated) throw new Error('Modification refusée : cette résidence n’est pas encore validée.');
      return updated;
    });
  }

  function ownerBookings(residenceIds) {
    if (!residenceIds || !residenceIds.length) return Promise.resolve([]);
    var today = new Date().toISOString().slice(0, 10);
    return request('/rest/v1/bookings?select=id,residence_id,start_date,end_date,guests,total,status' +
      '&residence_id=in.(' + residenceIds.join(',') + ')&status=in.(pending,confirmed)' +
      '&end_date=gte.' + today + '&order=start_date.asc');
  }

  function ownerMonthRevenue(residenceIds) {
    if (!residenceIds || !residenceIds.length) return Promise.resolve(0);
    var now = new Date();
    var start = new Date(Date.UTC(now.getFullYear(), now.getMonth(), 1)).toISOString().slice(0, 10);
    var next = new Date(Date.UTC(now.getFullYear(), now.getMonth() + 1, 1)).toISOString().slice(0, 10);
    return request('/rest/v1/bookings?select=total&residence_id=in.(' + residenceIds.join(',') + ')' +
      '&status=in.(confirmed,completed)&start_date=gte.' + start + '&start_date=lt.' + next)
      .then(function (rows) {
        return (rows || []).reduce(function (sum, r) { return sum + (r.total || 0); }, 0);
      });
  }

  function mySubscription() {
    return request('/rest/v1/subscriptions?select=*&owner_id=eq.' + uid() + '&status=eq.active&order=created_at.desc&limit=1')
      .then(first);
  }

  /* ---------- Réservations ---------- */
  function busyDates(residenceId) {
    if (!isId(residenceId)) return Promise.resolve([]);
    return request('/rest/v1/rpc/busy_dates', { method: 'POST', body: { p_residence: residenceId } })
      .then(function (rows) { return rows || []; });
  }

  /* Le prix est calculé par la base : on n'envoie ici que les dates et le nombre de personnes. */
  function createBooking(residenceId, start, end, guests) {
    return request('/rest/v1/rpc/create_booking', {
      method: 'POST',
      body: { p_residence: residenceId, p_start: start, p_end: end, p_guests: guests }
    });
  }

  function cancelBooking(bookingId) {
    return request('/rest/v1/rpc/cancel_booking', { method: 'POST', body: { p_booking: bookingId } });
  }

  /* Paiement Wave : la fonction serveur crée le paiement et renvoie l'adresse Wave où envoyer le voyageur. */
  function payBooking(bookingId, total) {
    /* Mode provisoire : lien de paiement Wave Business avec le montant déjà rempli. */
    if (cfg.wavePayLink) {
      var amount = Math.round(Number(total) || 0);
      return Promise.resolve(cfg.wavePayLink + (amount > 0 ? '?amount=' + amount : ''));
    }
    return refreshIfNeeded().then(function () {
      return fetch(cfg.supabaseUrl + '/functions/v1/wave-checkout', {
        method: 'POST',
        headers: {
          apikey: cfg.supabaseAnonKey,
          'Content-Type': 'application/json',
          Authorization: 'Bearer ' + (session && session.access_token)
        },
        body: JSON.stringify({ booking_id: bookingId })
      });
    }).then(function (r) {
      return r.text().then(function (t) {
        var body = null;
        try { body = t ? JSON.parse(t) : null; } catch (e) { body = null; }
        if (!r.ok || !body || !body.url) {
          var m = body && (body.message || body.msg || body.error);
          if (r.status === 404 && !m) m = 'Le paiement Wave n’est pas encore installé sur ce site.';
          throw new Error(m || 'Le paiement a échoué. Réessayez.');
        }
        return body.url;
      });
    });
  }

  function myBookings() {
    return request('/rest/v1/bookings?select=id,residence_id,start_date,end_date,days,guests,total,status,created_at,' +
      'residences(name,quarter)&client_id=eq.' + uid() + '&order=start_date.desc');
  }

  /* ---------- Outils ---------- */
  function fmt(n) { return String(n).replace(/\B(?=(\d{3})+(?!\d))/g, ' '); }

  function distanceKm(lat1, lng1, lat2, lng2) {
    var rad = Math.PI / 180;
    var dLat = (lat2 - lat1) * rad;
    var dLng = (lng2 - lng1) * rad;
    var a = Math.sin(dLat / 2) * Math.sin(dLat / 2) +
      Math.cos(lat1 * rad) * Math.cos(lat2 * rad) * Math.sin(dLng / 2) * Math.sin(dLng / 2);
    return 6371 * 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));
  }

  /* Position GPS du téléphone (le navigateur demande l'autorisation) */
  function locate() {
    return new Promise(function (resolve, reject) {
      if (!navigator.geolocation) {
        reject(new Error('La localisation n’est pas disponible sur cet appareil.'));
        return;
      }
      navigator.geolocation.getCurrentPosition(function (pos) {
        resolve({ lat: pos.coords.latitude, lng: pos.coords.longitude });
      }, function (err) {
        var msg = 'Position introuvable. Réessayez.';
        if (err && err.code === 1) msg = 'Localisation refusée. Autorisez-la dans Réglages, Safari, Localisation.';
        reject(new Error(msg));
      }, { enableHighAccuracy: true, timeout: 15000, maximumAge: 60000 });
    });
  }

  window.IvoireAPI = {
    configured: configured,
    session: function () { return session; },
    sendCode: sendCode,
    verifyCode: verifyCode,
    signOut: signOut,
    profile: profile,
    listResidences: listResidences,
    getResidence: getResidence,
    myResidences: myResidences,
    createResidence: createResidence,
    setStatus: setStatus,
    ownerBookings: ownerBookings,
    ownerMonthRevenue: ownerMonthRevenue,
    mySubscription: mySubscription,
    busyDates: busyDates,
    createBooking: createBooking,
    cancelBooking: cancelBooking,
    myBookings: myBookings,
    payBooking: payBooking,
    fmt: fmt,
    distanceKm: distanceKm,
    locate: locate
  };
})();

</script>
<script>
/*
 * app.js
 * Lanceur de l'application : choisit l'écran à afficher selon l'adresse (#/Fiche?id=..., #/Ajouter...),
 * vérifie la connexion pour les pages protégées, charge le fichier de l'écran dans screens/
 * et le dessine avec dc-lite.js.
 */
(function () {
  'use strict';

  var ROOT = document.getElementById('screen');
  var ROUTES = {
    Main: 1, Resultats: 1, Fiche: 1, Reservation: 1,
    Proprietaire: 1, Ajouter: 1, Abonnement: 1,
    Connexion: 1, Compte: 1
  };
  // Pages qui demandent une connexion : 'user' = tout compte, 'owner' = compte propriétaire
  var GUARDS = {
    Reservation: 'user', Compte: 'user',
    Proprietaire: 'owner', Ajouter: 'owner', Abonnement: 'owner'
  };
  var cache = {};
  var current = null;
  var showToken = 0;

  function parseHash() {
    var h = location.hash.replace(/^#\/?/, '');
    var q = h.indexOf('?');
    var name = q < 0 ? h : h.slice(0, q);
    var params = {};
    if (q >= 0) {
      h.slice(q + 1).split('&').forEach(function (pair) {
        if (!pair) return;
        var kv = pair.split('=');
        try {
          params[decodeURIComponent(kv[0])] = decodeURIComponent((kv[1] || '').replace(/\+/g, ' '));
        } catch (e) { /* paramètre illisible : ignoré */ }
      });
    }
    return { name: ROUTES[name] ? name : 'Main', params: params };
  }

  function fetchScreen(name) {
    if (cache[name]) return Promise.resolve(cache[name]);
    var inline = window.SCREENS && window.SCREENS[name];
    var source = inline
      ? Promise.resolve(inline)
      : fetch('screens/' + name + '.dc.html').then(function (r) {
          if (!r.ok) throw new Error('HTTP ' + r.status);
          return r.text();
        });
    return source.then(function (html) {
      cache[name] = window.DCLite.parse(html);
      return cache[name];
    });
  }

  /* Reprend les polices et styles propres à l'écran (balise <helmet> de la maquette) */
  function applyHelmet(def) {
    document.querySelectorAll('style[data-screen]').forEach(function (s) { s.remove(); });
    if (!def.helmet) return;
    def.helmet.querySelectorAll('style').forEach(function (s) {
      var copy = document.createElement('style');
      copy.setAttribute('data-screen', '');
      copy.textContent = s.textContent;
      document.head.appendChild(copy);
    });
    def.helmet.querySelectorAll('link[href]').forEach(function (l) {
      var href = l.getAttribute('href');
      if (!document.head.querySelector('link[href="' + href + '"]')) {
        var copy = document.createElement('link');
        copy.rel = l.getAttribute('rel') || 'stylesheet';
        copy.href = href;
        document.head.appendChild(copy);
      }
    });
  }

  function showError(err) {
    ROOT.replaceChildren();
    var box = document.createElement('div');
    box.className = 'app-error';
    var title = document.createElement('strong');
    title.textContent = 'Impossible d’afficher cet écran';
    var text = document.createElement('p');
    text.textContent = 'Ouvrez l’application depuis son adresse en ligne (https), pas depuis le fichier téléchargé. Détail : ' + err.message;
    box.appendChild(title);
    box.appendChild(text);
    ROOT.appendChild(box);
  }

  function render(route, token) {
    fetchScreen(route.name).then(function (def) {
      if (token !== showToken) return;
      applyHelmet(def);
      if (current) current.__render = null; // l'ancien écran ne doit plus se redessiner
      ROOT.replaceChildren();
      current = window.DCLite.mount(def, ROOT, route.params);
      window.scrollTo(0, 0);
    }).catch(function (err) {
      if (token === showToken) showError(err);
    });
  }

  function redirect(name, query) {
    location.replace('#/' + name + (query ? '?' + query : ''));
  }

  function show() {
    var token = ++showToken;
    var route = parseHash();
    var guard = GUARDS[route.name];
    var api = window.IvoireAPI;

    if (guard && api && api.configured()) {
      if (!api.session()) {
        var keep = Object.keys(route.params).map(function (k) { return encodeURIComponent(k) + '=' + encodeURIComponent(route.params[k]); }).join('&');
        redirect('Connexion', 'next=' + encodeURIComponent(route.name + (keep ? '?' + keep : '')));
        return;
      }
      if (guard === 'owner') {
        api.profile().then(function (p) {
          if (token !== showToken) return;
          if (p && p.role === 'owner') render(route, token);
          else redirect('Compte', 'notice=owner');
        }).catch(function (err) {
          if (token === showToken) showError(err);
        });
        return;
      }
    }
    render(route, token);
  }

  /* Les liens de la maquette (href="Fiche.dc.html?id=...") deviennent des liens de navigation */
  function go(name, query) {
    var target = (name === 'Main' && !query ? '#/' : '#/' + name) + (query ? '?' + query : '');
    if (location.hash === target) show();
    else location.hash = target;
  }

  document.addEventListener('click', function (e) {
    var a = e.target.closest ? e.target.closest('a[href]') : null;
    if (!a) return;
    var m = /(?:^|\/)([A-Za-z]+)\.dc\.html(?:\?(.*))?$/.exec(a.getAttribute('href'));
    if (!m || !ROUTES[m[1]]) return;
    e.preventDefault();
    go(m[1], m[2] || '');
  });

  window.addEventListener('hashchange', show);
  show();
})();

</script>
</body>
